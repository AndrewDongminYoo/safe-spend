version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    ignore:
      # typescript-eslint 8.72 supports TypeScript >=4.8.4 <6.1.0, and npm ci fails with ERESOLVE at TypeScript 7.0.2 (#10).
      # TypeScript moved to 6.0 by hand (#19). Blocking majors keeps it on 6.x.
      # update-types limits this to version updates; security updates still open.
      # Drop this entry when typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # @toss/tds-mobile 2.5.1, the latest release, allows React 18 or lower only (peer range ^16.8.3 || ^17 || ^18), and npm ci fails with ERESOLVE at React 19 (#14).
      # The type packages follow the React major, so they stay on 18 with it.
      # update-types limits this to version updates; security updates still open.
      # Drop these four entries when @toss/tds-mobile allows React 19.
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react-dom"
        update-types:
          - version-update:semver-major
      # Major updates of the Node type package are manual: the account follows Node LTS and accepts
      # types up to major 25, and Node 26 is not LTS yet (#16).
      # update-types limits this to version updates; security updates still open.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # Vite stays on 6 until a planned Vite migration (#17), and @vitejs/plugin-react 6 needs Vite 8.
      # update-types limits this to version updates; security updates still open.
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
