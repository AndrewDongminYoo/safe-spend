version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    ignore:
      # typescript-eslint 8.72 supports TypeScript >=4.8.4 <6.1.0, and npm ci fails with ERESOLVE at TypeScript 7.0.2 (#10).
      # Blocking majors keeps TypeScript on 5.7.x until a manual TypeScript 6 pull request merges, because 5.7.3 to 6.0.3 is a major update too.
      # update-types limits this to version updates; security updates still open.
      # Drop this entry when typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
